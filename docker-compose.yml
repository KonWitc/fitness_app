services:
  postgres:
    image: postgres:17-alpine
    container_name: fitness-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: fitness
      POSTGRES_PASSWORD: fitness
      POSTGRES_DB: fitness
    ports:
      # 5433 on the host: a native Windows PostgreSQL may already own 5432
      - '5433:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fitness -d fitness']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
